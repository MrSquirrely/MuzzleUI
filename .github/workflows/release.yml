name: Release

# Every update to main is a production release: build, test, pack, tag v<Version> and publish a GitHub Release,
# then push to NuGet.org with Trusted Publishing (OIDC, no stored API key) when the NUGET_USER repository variable
# holds your nuget.org profile name. Bump <Version> in src/Muzzle.Theme/Muzzle.Theme.csproj before merging. An
# existing GitHub Release is never overwritten, and versions already on NuGet.org are skipped, so re-runs are safe.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write   # create the tag and GitHub Release
  id-token: write   # let NuGet/login exchange a GitHub OIDC token for a one-hour NuGet API key

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  release:
    name: Build, test and publish
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (dotnet msbuild src/Muzzle.Theme/Muzzle.Theme.csproj -getProperty:Version).Trim()
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Could not read <Version> from Muzzle.Theme.csproj.' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing Muzzle.Theme $version"

      - name: Check for an existing release
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view '${{ steps.version.outputs.tag }}' --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -eq 0) {
            "exists=true" >> $env:GITHUB_OUTPUT
            Write-Host "::warning::Release ${{ steps.version.outputs.tag }} already exists, so no new GitHub Release is created. Bump <Version> in Muzzle.Theme.csproj to publish a new one."
          }
          else {
            "exists=false" >> $env:GITHUB_OUTPUT
          }
          exit 0

      - name: Restore
        run: dotnet restore Muzzle.slnx

      - name: Build (Release, warnings are errors)
        run: dotnet build Muzzle.slnx -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test tests/Muzzle.Theme.Tests -c Release --no-build

      - name: Pack
        run: dotnet pack src/Muzzle.Theme -c Release --no-build -o artifacts -warnaserror

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package-${{ steps.version.outputs.version }}
          path: artifacts/*

      - name: Create GitHub Release
        if: steps.existing.outputs.exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem artifacts -File | ForEach-Object FullName
          gh release create '${{ steps.version.outputs.tag }}' @assets `
            --repo '${{ github.repository }}' `
            --target '${{ github.sha }}' `
            --title 'Muzzle.Theme ${{ steps.version.outputs.version }}' `
            --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Trusted Publishing: no stored secret. The temporary key lasts an hour, so it is requested right before the push.
      - name: NuGet login (OIDC to temporary API key)
        id: nuget-login
        if: vars.NUGET_USER != ''
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to NuGet.org
        if: vars.NUGET_USER != ''
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          # The .snupkg next to the .nupkg is pushed to the NuGet symbol server automatically.
          dotnet nuget push 'artifacts/*.nupkg' --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Note skipped NuGet publish
        if: vars.NUGET_USER == ''
        run: echo "::notice::The NUGET_USER repository variable is not set, so NuGet.org publishing was skipped. See AGENTS.md (Branches and releases) to set up Trusted Publishing."